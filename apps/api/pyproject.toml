[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "global-segregation-atlas-api"
version = "0.1.0"
description = "Request-scoped official socioeconomic analysis"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn>=0.34,<1", "httpx==0.28.1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "numpy>=2.2,<3",
  "pandas>=2.2,<4", "shapely>=2.1,<3", "pyproj>=3.7,<4",
  "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
rank = ["segregation==2.6.0"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: opt-in external official service integration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
